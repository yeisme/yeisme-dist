name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and catalog checks
        run: scripts/check.sh

  install-smoke:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        product: [gitea-mcp, sonora]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Anonymous install (${{ matrix.product }})
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          DIST_SYNC_TOKEN: ""
        run: |
          dest="$(mktemp -d)/bin"
          # Drop every GitHub credential so this matches env -i installers.
          env -u GH_TOKEN -u GITHUB_TOKEN -u DIST_SYNC_TOKEN -u GH_ENTERPRISE_TOKEN \
            bash install.sh "${{ matrix.product }}" --to "$dest"
          test -x "$dest/${{ matrix.product }}"
          "$dest/${{ matrix.product }}" --help >/dev/null
          echo "install-smoke: ${{ matrix.product }} ok"
